<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Negative Box Annotator</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #1e1e1e; color: #eee; }
  header { padding: 10px 16px; background: #2b2b2b; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  button, label.btn { background: #3a6ea5; color: #fff; border: 0; padding: 7px 12px; border-radius: 5px; cursor: pointer; font-size: 13px; }
  button:hover, label.btn:hover { background: #4a82c0; }
  #wrap { display: flex; gap: 12px; padding: 12px; }
  #canvasBox { flex: 1; overflow: auto; border: 1px solid #444; max-height: 88vh; }
  #side { width: 340px; flex-shrink: 0; }
  canvas { cursor: crosshair; display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid #444; padding: 3px 5px; text-align: left; }
  input.lbl { width: 90px; background: #333; color: #eee; border: 1px solid #555; }
  #json { width: 100%; height: 180px; background: #111; color: #6c6; border: 1px solid #444; font-family: monospace; font-size: 11px; }
  .hint { font-size: 12px; color: #aaa; }
  .del { background:#a44; padding:2px 7px; }
</style>
</head>
<body>
<header>
  <h1>Negative Box Annotator</h1>
  <label class="btn">Load frame image<input type="file" id="file" accept="image/*" hidden></label>
  <input class="lbl" id="curLabel" value="hub" title="label for the NEXT box you draw">
  <button id="copyBtn">Copy JSON</button>
  <button id="dlBtn">Download boxes.json</button>
  <span class="hint" id="dims">load a frame, then drag to draw boxes (label set above applies to the next box)</span>
</header>
<div id="wrap">
  <div id="canvasBox"><canvas id="cv"></canvas></div>
  <div id="side">
    <table id="tbl"><thead><tr><th>label</th><th>x1,y1,x2,y2</th><th></th></tr></thead><tbody></tbody></table>
    <p class="hint">Coords are in ORIGINAL image pixels. Draw the box tight around the structure (hub face / outpost / scoreboard). Send me the JSON.</p>
    <textarea id="json" readonly></textarea>
  </div>
</div>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let img = null, scale = 1, boxes = [], drag = null;

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => {
    img = im;
    const maxW = Math.min(window.innerWidth - 380, 1600);
    scale = Math.min(1, maxW / im.width);
    cv.width = Math.round(im.width * scale);
    cv.height = Math.round(im.height * scale);
    document.getElementById('dims').textContent = `image ${im.width}×${im.height}px (display scale ${scale.toFixed(3)})`;
    redraw();
  };
  im.src = URL.createObjectURL(f);
});

function toOrig(x, y) { return [Math.round(x / scale), Math.round(y / scale)]; }

cv.addEventListener('mousedown', e => {
  const r = cv.getBoundingClientRect();
  drag = { x0: e.clientX - r.left, y0: e.clientY - r.top, x1: 0, y1: 0 };
});
cv.addEventListener('mousemove', e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect();
  drag.x1 = e.clientX - r.left; drag.y1 = e.clientY - r.top;
  redraw();
});
window.addEventListener('mouseup', () => {
  if (!drag) return;
  const [ox1, oy1] = toOrig(Math.min(drag.x0, drag.x1), Math.min(drag.y0, drag.y1));
  const [ox2, oy2] = toOrig(Math.max(drag.x0, drag.x1), Math.max(drag.y0, drag.y1));
  if (ox2 - ox1 > 4 && oy2 - oy1 > 4) {
    boxes.push({ label: document.getElementById('curLabel').value || 'neg', x1: ox1, y1: oy1, x2: ox2, y2: oy2 });
    sync();
  }
  drag = null; redraw();
});

function redraw() {
  if (!img) return;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  ctx.lineWidth = 2; ctx.font = '13px sans-serif';
  boxes.forEach((b, i) => {
    ctx.strokeStyle = '#ff3b3b'; ctx.fillStyle = '#ff3b3b';
    ctx.strokeRect(b.x1 * scale, b.y1 * scale, (b.x2 - b.x1) * scale, (b.y2 - b.y1) * scale);
    ctx.fillText(`${i}:${b.label}`, b.x1 * scale + 3, b.y1 * scale + 14);
  });
  if (drag) { ctx.strokeStyle = '#3bf'; ctx.strokeRect(drag.x0, drag.y0, drag.x1 - drag.x0, drag.y1 - drag.y0); }
}

function sync() {
  const tb = document.querySelector('#tbl tbody'); tb.innerHTML = '';
  boxes.forEach((b, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><input class="lbl" value="${b.label}" data-i="${i}"></td>` +
      `<td>${b.x1},${b.y1},${b.x2},${b.y2}</td><td><button class="del" data-i="${i}">x</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('input.lbl').forEach(inp => inp.addEventListener('change', e => { boxes[+e.target.dataset.i].label = e.target.value; sync(); }));
  tb.querySelectorAll('button.del').forEach(btn => btn.addEventListener('click', e => { boxes.splice(+e.target.dataset.i, 1); sync(); redraw(); }));
  document.getElementById('json').value = JSON.stringify(boxes, null, 2);
}

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('json').value); });
document.getElementById('dlBtn').addEventListener('click', () => {
  const blob = new Blob([document.getElementById('json').value], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'boxes.json'; a.click(); });
</script>
</body>
</html>
