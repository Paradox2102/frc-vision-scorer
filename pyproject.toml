[project]
name = "frc-vision-scorer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pupil-apriltags>=1.0.4",
    # SAM2 tracking spike (SP-T). NOTE: this manifest under-declares the ML stack
    # (torch/ultralytics/supervision are installed directly into .venv); sam2 is
    # recorded here because the spike adds it. Checkpoint weights are gitignored.
    "sam2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.optional-dependencies]
sam3 = [
    "numpy>=1.26,<2",
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@8e451d5eb43c817b64ae7577fb7b9ae223db88a9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: tests that load the DINOv2 model (downloads weights once, slower)",
]
