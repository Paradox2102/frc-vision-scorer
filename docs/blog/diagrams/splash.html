<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&display=block" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1000px; height: 250px; overflow: hidden; background: #05070d; }
.frame { position: absolute; inset: 0; overflow: hidden; }
/* x-ray frame: a band across the field through the robot cluster, pushed right so the title has room */
.frame img { position: absolute; width: 1270px; left: -130px; top: -172px; filter: saturate(1.15) contrast(1.05); }
.shade { position: absolute; inset: 0;
  background:
    linear-gradient(90deg, rgba(3,5,10,.96) 0%, rgba(3,5,10,.88) 30%, rgba(3,5,10,.35) 52%, rgba(3,5,10,0) 66%),
    linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 25%, rgba(0,0,0,0) 75%, rgba(0,0,0,.45) 100%); }
.title { position: absolute; left: 42px; top: 50%; transform: translateY(-54%);
  font-family: 'Anton', Impact, sans-serif; line-height: .95; text-transform: uppercase; letter-spacing: 1.5px; }
.title span { display: block; -webkit-text-stroke: 4px #0a0a0a; paint-order: stroke fill;
  text-shadow: 0 4px 0 rgba(0,0,0,.7), 0 0 14px rgba(0,0,0,.9), 0 0 28px rgba(0,0,0,.6); }
.gold { color: #FFC20E; font-size: 84px; }
.red  { color: #E8202A; font-size: 58px; }
.rule { position: absolute; left: 44px; bottom: 26px; width: 300px; height: 5px; display: flex; gap: 6px; }
.rule i { flex: 1; border-radius: 3px; }
.rule i:first-child { background: #FFC20E; } .rule i:last-child { background: #E8202A; }
</style></head>
<body>
<div class="frame"><img src="assets/xray_qm10_t80.png" alt=""></div>

<div class="title"><span class="gold">2102</span><span class="red">Vision Scouting</span></div>
<div class="rule"><i></i><i></i></div>
</body></html>
